<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lepexasu | Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070505;
      --red: #ff1f4b;
      --red-soft: rgba(255, 31, 75, .4);
      --red-faint: rgba(255, 31, 75, .07);
      --green: #2dff6e;
      --green-soft: rgba(45, 255, 110, .4);
      --purple: #8a3ffc;
      --card-bg: rgba(14, 6, 8, .9);
      --text: #fff4f6;
      --muted: #c48a96;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(255,31,75,.14) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 70%, rgba(45,255,110,.10) 0%, transparent 45%),
        linear-gradient(180deg, #060404 0%, #0e0608 50%, #0a0605 100%);
    }
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image:
        linear-gradient(var(--red-faint) 1px, transparent 1px),
        linear-gradient(90deg, var(--red-faint) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    html::after {
      content: " ";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 100;
    }

    .main-container {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 34px;
    }

    .photo-row {
      display: flex;
      gap: 20px;
      width: 100%;
      align-items: flex-start;
    }

    .photo {
      flex: 1;
      width: 0;
      position: relative;
      filter: drop-shadow(0 12px 25px rgba(0,0,0,.6));
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), filter .3s ease;
    }
    .photo:nth-child(1) { transform: rotate(-2deg); }
    .photo:nth-child(2) { transform: rotate(2deg); margin-top: 24px; }

    .photo:hover {
      transform: translateY(-10px) rotate(0) scale(1.04);
      filter: drop-shadow(0 18px 35px rgba(255,31,75,.3));
      z-index: 2;
    }

    .photo::before, .photo::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      border: 2px solid var(--green);
      opacity: .9;
      pointer-events: none;
      z-index: 3;
    }
    .photo::before { top: -5px; left: -5px; border-right: 0; border-bottom: 0; }
    .photo::after  { right: -5px; bottom: -5px; border-left: 0; border-top: 0; }

    .polaroid {
      background: #ffffff;
      padding: 4% 4% 14%;
      border-radius: 3px;
      box-shadow:
        0 0 0 2px var(--purple),
        0 3px 0 var(--red) inset,
        0 4px 12px rgba(0,0,0,.4);
    }
    .polaroid img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #140609;
    }

    .card {
      position: relative;
      width: 100%;
      padding: 34px 26px 30px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--red-soft);
      box-shadow:
        0 0 30px rgba(255,31,75,.12),
        inset 0 0 40px rgba(0,0,0,.5);
    }
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      border: 2px solid var(--green);
      pointer-events: none;
    }
    .card::before { top: -6px; left: -6px; border-right: 0; border-bottom: 0; }
    .card::after  { right: -6px; bottom: -6px; border-left: 0; border-top: 0; }

    h1 {
      display: inline-block;
      font-family: 'VT323', monospace;
      font-size: clamp(2.8rem, 10vw, 4rem);
      font-weight: 700;
      color: var(--red);
      text-shadow: 3px 3px 0 var(--green);
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 22px;
    }

    .blink { animation: blinker 1s linear infinite; }
    @keyframes blinker { 50% { opacity: 0; } }


    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 8px;
    }

    .game-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 1.5px solid var(--red-soft);
      background: #140609;
      cursor: default;
      transition: border-color .25s, box-shadow .25s;
    }


    .game-photo {
      position: absolute;
      inset: 0;
      background: var(--img, none) center / cover no-repeat;
      filter: grayscale(70%) brightness(.8);
      transition: filter .3s, transform .3s;
    }
    /* цветные копии фото для глитча */
    .game-photo::before, .game-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: inherit;
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
    }
    .game-photo::before { filter: saturate(3) hue-rotate(-50deg); }
    .game-photo::after  { filter: saturate(3) hue-rotate(110deg); }

    
    .game-item.empty::before {
      content: '+ ФОТО';
      position: absolute;
      inset: 0;
      margin: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--red-soft);
      font-family: 'VT323', monospace;
      font-size: 1.8rem;
      color: var(--red);
      pointer-events: none;
      transition: color .25s, border-color .25s;
    }
    .game-item.empty:hover::before { color: var(--green); border-color: var(--green); }

    .game-label {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      padding: 3px 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: .6rem;
      letter-spacing: 2px;
      color: var(--text);
      background: rgba(7,5,5,.78);
      border-right: 1.5px solid var(--red-soft);
      border-bottom: 1.5px solid var(--red-soft);
    }

    .game-name {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 2;
      padding: 18px 8px 9px;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: .7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text);
      background: linear-gradient(transparent, rgba(7,5,5,.92));
      transition: color .3s;
    }


    .game-item:hover {
      border-color: var(--green);
      box-shadow: 0 0 18px rgba(45,255,110,.3), 4px 4px 0 var(--red);
      animation: tile-jitter .45s steps(1, end) infinite;
    }
    .game-item:hover .game-photo {
      filter: grayscale(0%) brightness(1.1);
      transform: scale(1.05);
    }
    .game-item:hover .game-photo::before {
      opacity: .85;
      animation: glitch-a .55s steps(1, end) infinite;
    }
    .game-item:hover .game-photo::after {
      opacity: .85;
      animation: glitch-b .45s steps(1, end) infinite;
    }
    .game-item:hover .game-name {
      color: var(--green);
      animation: name-glitch .5s steps(1, end) infinite;
    }

    @keyframes tile-jitter {
      0%   { transform: translate(0, -4px); }
      20%  { transform: translate(-3px, -3px); }
      40%  { transform: translate(2px, -5px); }
      60%  { transform: translate(0, -4px); }
      80%  { transform: translate(-1px, -4px); }
      100% { transform: translate(0, -4px); }
    }
    @keyframes name-glitch {
      0%   { text-shadow: 2px 0 var(--red), -2px 0 var(--green); transform: translateX(0); }
      25%  { text-shadow: -3px 0 var(--red), 3px 0 var(--green); transform: translateX(3px); }
      50%  { text-shadow: none; transform: translateX(0); }
      75%  { text-shadow: 2px 1px var(--red), -2px -1px var(--green); transform: translateX(-2px); }
      100% { text-shadow: 1px 0 var(--red), -1px 0 var(--green); transform: translateX(0); }
    }

   
    .disconnect-btn {
      position: relative;
      overflow: hidden;
      display: inline-block;
      margin-top: 22px;
      padding: 12px 26px;
      border: 1.5px solid var(--red-soft);
      background: none;
      color: var(--muted);
      font-family: 'Orbitron', sans-serif;
      font-size: .75rem;
      letter-spacing: 4px;
      cursor: pointer;
      transition: background .25s, color .25s, border-color .25s, box-shadow .25s;
    }
    .disconnect-btn::before, .disconnect-btn::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      padding: 12px 26px;
      text-align: center;
      font: inherit;
      letter-spacing: inherit;
      background: transparent;
      opacity: 0;
      pointer-events: none;
    }
    .disconnect-btn::before { color: var(--green); }
    .disconnect-btn::after  { color: #ffffff; }

    .disconnect-btn:hover, .disconnect-btn:focus-visible {
      background: var(--red);
      color: #1a0206;
      border-color: var(--red);
      box-shadow: 0 0 20px rgba(255,31,75,.6), 4px 4px 0 var(--green);
      outline: none;
      animation: btn-jitter-red .4s steps(1, end) infinite;
    }
    .disconnect-btn:hover::before, .disconnect-btn:focus-visible::before {
      opacity: 1;
      animation: glitch-a .55s steps(1, end) infinite;
    }
    .disconnect-btn:hover::after, .disconnect-btn:focus-visible::after {
      opacity: 1;
      animation: glitch-b .45s steps(1, end) infinite;
    }

    @keyframes btn-jitter-red {
      0%   { transform: translate(0, 0) scale(1.04); background: var(--red); }
      15%  { transform: translate(-3px, 1px) scale(1.04) skewX(-4deg); }
      30%  { transform: translate(2px, -1px) scale(1.04); }
      45%  { transform: translate(0, 0) scale(1.04); background: var(--green); color: #04150a; }
      50%  { background: var(--red); color: #1a0206; }
      70%  { transform: translate(3px, 0) scale(1.04) skewX(5deg); }
      85%  { transform: translate(-1px, 1px) scale(1.04); }
      100% { transform: translate(0, 0) scale(1.04); }
    }
    @keyframes glitch-a {
      0%   { clip-path: inset(10% 0 70% 0); transform: translate(-5px, 0); }
      20%  { clip-path: inset(60% 0 10% 0); transform: translate(4px, 0); }
      40%  { clip-path: inset(30% 0 40% 0); transform: translate(-3px, 1px); }
      60%  { clip-path: inset(80% 0 0 0);   transform: translate(6px, 0); }
      80%  { clip-path: inset(0 0 85% 0);   transform: translate(-4px, -1px); }
      100% { clip-path: inset(45% 0 35% 0); transform: translate(2px, 0); }
    }
    @keyframes glitch-b {
      0%   { clip-path: inset(70% 0 10% 0); transform: translate(5px, 0); }
      25%  { clip-path: inset(5% 0 80% 0);  transform: translate(-6px, 0); }
      50%  { clip-path: inset(40% 0 30% 0); transform: translate(3px, -1px); }
      75%  { clip-path: inset(85% 0 0 0);   transform: translate(-3px, 0); }
      100% { clip-path: inset(20% 0 55% 0); transform: translate(4px, 1px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .polaroid { animation: fadeIn 1s ease-out; }
    .card     { animation: fadeIn .8s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      .polaroid, .card { animation: none; }
      .disconnect-btn:hover, .disconnect-btn:focus-visible,
      .disconnect-btn:hover::before, .disconnect-btn:focus-visible::before,
      .disconnect-btn:hover::after, .disconnect-btn:focus-visible::after,
      .game-item:hover, .game-item:hover .game-name,
      .game-item:hover .game-photo::before, .game-item:hover .game-photo::after { animation: none; }
    }

    .fade-out {
      position: fixed; inset: 0;
      background: #000;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s ease-in-out;
    }
    body.shutting-down .fade-out { opacity: 1; }

    .card .bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: linear-gradient(90deg, var(--red), var(--green), var(--red));
      opacity: .75;
    }

    @media (max-width: 480px) {
      .photo-row { gap: 12px; }
      .card { padding: 28px 16px 24px; }
      .games-grid { gap: 12px; }
      .game-name { font-size: .6rem; letter-spacing: 1px; }
    }
  </style>
</head>
<body>

  <div class="fade-out"></div>

  <div class="main-container">
    <div class="photo-row">
      <div class="photo">
        <div class="polaroid">
          <img src="https://i.ibb.co/wZC810kW/probably-first-capri-pin.jpg" alt="Photo 1">
        </div>
      </div>
      <div class="photo">
        <div class="polaroid">
          <img src="https://i.ibb.co/5xrpyGVC/Capri-from-Cyberpunk-edgerunners.jpg" alt="Photo 2">
        </div>
      </div>
    </div>

    <div class="card">
      <h1>GAMES<span class="blink">_</span></h1>

      <div class="games-grid">

        <div class="game-item">
          <div class="game-photo" style="--img: url('https://i.ibb.co/hF2GPgzG/pngwing-com.png')"></div>
          <span class="game-label">01</span>
          <span class="game-name">Minecraft</span>
        </div>
        <div class="game-item">
          <div class="game-photo" style="--img: url('https://i.ibb.co/230whkcZ/toppng-com-tree-terraria-tree-logo-401x741.png')"></div>
          <span class="game-label">02</span>
          <span class="game-name">Terraria</span>
        </div>
        <div class="game-item empty">
          <div class="game-photo" style="--img: url('https://i.ibb.co/VYf3cWzv/6d63fb43435cd23f622f511ad68de26d.png')"></div>
          <span class="game-label">03</span>
          <span class="game-name">Metro</span>
        </div>
        <div class="game-item">
          <div class="game-photo" style="--img: url('https://i.ibb.co/W4VB5XNt/pngegg.png')"></div>
          <span class="game-label">04</span>
          <span class="game-name">Slime Rancher</span>
        </div>
        <div class="game-item empty">
          <div class="game-photo" style="--img: url('https://i.ibb.co/1YBdxr6f/MAFIA-Definitive-Edition-ICO-by-NC831.png')"></div>
          <span class="game-label">05</span>
          <span class="game-name">Mafia</span>
        </div>
        <div class="game-item empty">
          <div class="game-photo" style="--img: url('https://i.ibb.co/BVtsdf8W/hotline-miami-icon-by-keke4050-dfl2mir.png')"></div>
          <span class="game-label">06</span>
          <span class="game-name">Hotline Miami</span>
        </div>
      </div>

      <button class="disconnect-btn" data-text="DISCONNECT" onclick="disconnect()">DISCONNECT</button>

      <div class="bar"></div>
    </div>
  </div>

  <script>
    function disconnect() {
      document.body.classList.add('shutting-down');
      setTimeout(function () {
        window.location.href = "https://lepexasu.github.io/biolepexasu.github.io/";
      }, 500);
    }
  </script>

</body>
</html>
